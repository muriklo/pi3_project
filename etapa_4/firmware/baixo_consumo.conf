# SysCare - build de baixo consumo, para medir a autonomia da pulseira.
#
# Fragmento somado ao prj.conf. No nRF Connect for VS Code: Add build
# configuration > Extra Kconfig fragments > baixo_consumo.conf. Na linha de
# comando: west build -b xiao_ble -- -DEXTRA_CONF_FILE=baixo_consumo.conf
#
# Tira tudo o que so serve para depurar. Sem isso, a pilha USB fica
# ativa, a thread de log acorda a CPU e cada printk formata texto que
# ninguem le. A gravacao continua igual: o bootloader UF2 (dois toques no
# reset) nao depende do firmware.

# Console e logs
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_CONSOLE=n

# Serial (a UART ja esta desligada no devicetree; o console era a USB)
CONFIG_SERIAL=n

# Pilha USB: sem console, nada mais usa a USB
CONFIG_USB_DEVICE_STACK_NEXT=n
