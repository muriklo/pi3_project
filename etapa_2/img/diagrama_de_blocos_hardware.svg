<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
<defs>
<marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="1440" height="990" fill="#ffffff"/>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#111827">Diagrama de blocos da pulseira — hardware e firmware</text>
<text x="20" y="52" font-size="13" fill="#4b5563">SysCare · protótipo da etapa 2</text>

<!-- ============ Bateria ============ -->
<rect x="640" y="40" width="200" height="80" fill="#ffc7c7" stroke="#1f2937" stroke-width="1.5"/>
<text x="740" y="74" text-anchor="middle" font-weight="bold" fill="#111827">Bateria</text>
<text x="740" y="96" text-anchor="middle" fill="#111827">CR2032 · 3 V</text>

<!-- ============ XIAO nRF52840 ============ -->
<rect x="380" y="210" width="720" height="470" fill="#fff2b3" stroke="#1f2937" stroke-width="1.5"/>
<text x="740" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">XIAO nRF52840 (Seeed Studio)</text>

<!-- Linha A: lógica da aplicação no firmware -->
<g stroke="#1f2937" stroke-width="1.2" fill="#c9daf8">
  <rect x="400" y="260" width="260" height="60"/>
  <rect x="680" y="260" width="120" height="60"/>
  <rect x="820" y="260" width="260" height="60"/>
</g>
<text x="530" y="286" text-anchor="middle" font-weight="bold" fill="#111827">Detecção de queda (FSM)</text>
<text x="530" y="306" text-anchor="middle" font-size="12" fill="#374151">queda livre → impacto → imobilidade</text>
<text x="740" y="286" text-anchor="middle" font-weight="bold" fill="#111827">Pré-alarme</text>
<text x="740" y="306" text-anchor="middle" font-size="12" fill="#374151">cancelamento 10 s</text>
<text x="950" y="286" text-anchor="middle" font-weight="bold" fill="#111827">Montagem do pacote</text>
<text x="950" y="306" text-anchor="middle" font-size="12" fill="#374151">14 bytes + HMAC-SHA256</text>

<!-- Linha B: serviços e drivers -->
<g stroke="#1f2937" stroke-width="1.2" fill="#c9daf8">
  <rect x="400" y="360" width="120" height="60"/>
  <rect x="540" y="360" width="120" height="60"/>
  <rect x="680" y="360" width="120" height="60"/>
  <rect x="820" y="360" width="120" height="60"/>
  <rect x="960" y="360" width="120" height="60"/>
</g>
<text x="460" y="386" text-anchor="middle" fill="#111827">Tratamento de</text>
<text x="460" y="404" text-anchor="middle" fill="#111827">interrupção</text>
<text x="600" y="386" text-anchor="middle" fill="#111827">Driver do</text>
<text x="600" y="404" text-anchor="middle" fill="#111827">acelerômetro</text>
<text x="740" y="386" text-anchor="middle" fill="#111827">NVS</text>
<text x="740" y="404" text-anchor="middle" font-size="12" fill="#374151">seq e chave</text>
<text x="880" y="386" text-anchor="middle" fill="#111827">Gestão de</text>
<text x="880" y="404" text-anchor="middle" fill="#111827">energia</text>
<text x="1020" y="386" text-anchor="middle" fill="#111827">BLE Stack</text>
<text x="1020" y="404" text-anchor="middle" font-size="12" fill="#374151">advertising</text>

<!-- Ligações que atravessam o Zephyr (a barra fica por cima) -->
<g fill="none" stroke="#15803d" stroke-width="2">
  <path d="M460,500 L460,422" marker-end="url(#v)"/>
  <path d="M600,422 L600,498" marker-start="url(#v)" marker-end="url(#v)"/>
  <path d="M740,422 L740,498" marker-start="url(#v)" marker-end="url(#v)"/>
  <path d="M880,500 L880,422" marker-end="url(#v)"/>
  <path d="M1020,420 L1020,498" marker-end="url(#v)"/>
</g>
<!-- Zephyr -->
<rect x="400" y="440" width="680" height="34" fill="#a4c2f4" stroke="#1f2937" stroke-width="1.2"/>
<text x="740" y="462" text-anchor="middle" fill="#111827"><tspan font-weight="bold">Zephyr RTOS</tspan> · nRF Connect SDK (kernel, drivers, controlador BLE)</text>

<!-- Linha C: periféricos do SoC -->
<rect x="392" y="490" width="696" height="110" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<g stroke="#1f2937" stroke-width="1.2" fill="#ffe680">
  <rect x="400" y="500" width="120" height="60"/>
  <rect x="540" y="500" width="120" height="60"/>
  <rect x="680" y="500" width="120" height="60"/>
  <rect x="820" y="500" width="120" height="60"/>
  <rect x="960" y="500" width="120" height="60"/>
</g>
<text x="460" y="526" text-anchor="middle" fill="#111827">GPIO</text>
<text x="460" y="544" text-anchor="middle" font-size="12" fill="#374151">+ GPIOTE</text>
<text x="600" y="526" text-anchor="middle" fill="#111827">SPIM</text>
<text x="600" y="544" text-anchor="middle" font-size="12" fill="#374151">SPI mestre</text>
<text x="740" y="526" text-anchor="middle" fill="#111827">Flash interna</text>
<text x="740" y="544" text-anchor="middle" font-size="12" fill="#374151">1 MB</text>
<text x="880" y="526" text-anchor="middle" fill="#111827">SAADC</text>
<text x="880" y="544" text-anchor="middle" font-size="12" fill="#374151">mede VDD</text>
<text x="1020" y="526" text-anchor="middle" fill="#111827">Rádio</text>
<text x="1020" y="544" text-anchor="middle" font-size="12" fill="#374151">2,4 GHz</text>
<text x="620" y="588" font-size="12" font-style="italic" fill="#4b5563">SoC nRF52840 · Cortex-M4F · 64 MHz · 256 KB RAM</text>

<!-- Antena -->
<rect x="960" y="612" width="120" height="52" fill="#ffe680" stroke="#1f2937" stroke-width="1.2"/>
<text x="1020" y="634" text-anchor="middle" fill="#111827">Antena</text>
<text x="1020" y="652" text-anchor="middle" font-size="12" fill="#374151">cerâmica, na placa</text>

<!-- Ligações internas -->
<g fill="none" stroke="#15803d" stroke-width="2">
  <path d="M660,290 L678,290" marker-end="url(#v)"/>
  <path d="M800,290 L818,290" marker-end="url(#v)"/>
  <path d="M460,360 L460,322" marker-end="url(#v)"/>
