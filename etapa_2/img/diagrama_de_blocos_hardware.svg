<rect x="1220" y="600" width="180" height="80" fill="#ffa64d" stroke="#1f2937" stroke-width="1.5"/>
<text x="1310" y="636" text-anchor="middle" fill="#111827">Smartphone</text>
<text x="1310" y="656" text-anchor="middle" fill="#111827">App SysCare</text>
<path d="M1080,630 L1218,630" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#v)"/>
<path d="M1220,662 L1082,662" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#v)"/>
<text x="1150" y="608" text-anchor="middle" font-size="16" fill="#15803d">BLE</text>
<text x="1150" y="623" text-anchor="middle" font-size="12" fill="#15803d">advertising</text>
<text x="1160" y="696" text-anchor="middle" font-size="12" fill="#4b5563">conexão (previsto)</text>

