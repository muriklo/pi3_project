  <path d="M1020,320 L1020,358" marker-end="url(#v)"/>
  <path d="M740,360 L740,340 L840,340 L840,322" marker-start="url(#v)" marker-end="url(#v)"/>
  <path d="M1020,560 L1020,610" marker-end="url(#v)"/>
</g>

<!-- ============ Alimentação ============ -->
<path d="M700,120 L700,208" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
<path d="M780,120 L780,208" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#p)"/>
<text x="690" y="170" text-anchor="end" font-size="16" fill="#dc2626">VCC 3 V</text>
<text x="790" y="170" font-size="16" fill="#374151">GND</text>
<path d="M640,68 L90,68 L90,820 L378,820" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
<path d="M640,100 L112,100 L112,850 L378,850" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#p)"/>
<text x="250" y="812" font-size="14" fill="#dc2626">VCC</text>
<text x="250" y="842" font-size="14" fill="#374151">GND</text>

<!-- ============ Periféricos externos ============ -->
<rect x="150" y="380" width="150" height="50" fill="#ffffff" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="225" y="401" text-anchor="middle" fill="#111827">Buzzer / vibração</text>
<text x="225" y="419" text-anchor="middle" font-size="12" fill="#4b5563">(previsto)</text>
<rect x="150" y="470" width="150" height="50" fill="#fff2b3" stroke="#1f2937" stroke-width="1.2"/>
<text x="225" y="500" text-anchor="middle" fill="#111827">LEDs de status</text>
<rect x="150" y="575" width="150" height="50" fill="#fff2b3" stroke="#1f2937" stroke-width="1.2"/>
<text x="225" y="597" text-anchor="middle" fill="#111827">Botão de</text>
<text x="225" y="615" text-anchor="middle" fill="#111827">emergência</text>

<g fill="none" stroke="#15803d" stroke-width="2">
  <path d="M400,520 L340,520 L340,495 L302,495" marker-end="url(#v)"/>
  <path d="M302,600 L340,600 L340,545 L398,545" marker-end="url(#v)"/>
  <path d="M340,495 L340,405 L302,405" stroke-dasharray="6 4" marker-end="url(#v)"/>
</g>
<text x="225" y="455" text-anchor="middle" font-size="13" fill="#15803d">GPIO · saída</text>
<text x="225" y="646" text-anchor="middle" font-size="13" fill="#15803d">GPIO · entrada (IRQ)</text>

<!-- ============ Acelerômetro ============ -->
<rect x="380" y="760" width="380" height="180" fill="#fff2b3" stroke="#1f2937" stroke-width="1.5"/>
<text x="570" y="788" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Acelerômetro IIM-42351 (TDK)</text>
<text x="570" y="810" text-anchor="middle" font-size="13" fill="#374151">3 eixos · ±16 g · 16 bits · FIFO 2 KB</text>
<rect x="430" y="828" width="280" height="96" fill="#ffe680" stroke="#1f2937" stroke-width="1.2"/>
<text x="570" y="852" text-anchor="middle" font-weight="bold" fill="#111827">Funções internas do sensor</text>
<text x="570" y="876" text-anchor="middle" fill="#111827">detecção de queda livre</text>
<text x="570" y="898" text-anchor="middle" fill="#111827">wake-on-motion</text>
<text x="570" y="916" text-anchor="middle" font-size="12" fill="#4b5563">geram a interrupção INT1</text>

<g fill="none" stroke="#15803d" stroke-width="2">
  <path d="M600,562 L600,758" marker-start="url(#v)" marker-end="url(#v)"/>
  <path d="M460,758 L460,562" marker-end="url(#v)"/>
</g>
<text x="612" y="722" font-size="15" fill="#15803d">SPI</text>
<text x="612" y="740" font-size="12" fill="#15803d">SCK · MOSI · MISO · CS</text>
<text x="450" y="730" text-anchor="end" font-size="15" fill="#15803d">INT1</text>

