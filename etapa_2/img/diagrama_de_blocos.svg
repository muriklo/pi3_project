<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4450"/></marker>
<marker id="seta_f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4450"/></marker>
<radialGradient id="moeda" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f9fafb"/><stop offset="0.6" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/></radialGradient>
<linearGradient id="bt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
<linearGradient id="nuvem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
</defs>
<rect width="2000" height="1120" fill="#ffffff"/>

<!-- Moldura geral -->
<text x="8" y="22" font-size="15" fill="#111827">Arquitetura do Sistema de Detecção de Quedas — SysCare (protótipo da etapa 2)</text>
<rect x="4" y="36" width="1990" height="1078" fill="none" stroke="#1f2937" stroke-width="1.5"/>

<!-- Dispositivo vestível -->
<text x="30" y="66" font-size="15" fill="#111827">Dispositivo vestível (pulseira)</text>
<rect x="28" y="78" width="830" height="1010" fill="none" stroke="#1f2937" stroke-width="1.5"/>

<!-- ================= Camada 1 - Hardware ================= -->
