<g transform="translate(516,236) rotate(38)">
  <circle cx="22" cy="-38" r="12" fill="#1d4ed8"/>
  <g fill="none" stroke="#1d4ed8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
