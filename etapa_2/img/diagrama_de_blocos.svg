</g>
<text x="166" y="305" font-size="20" fill="#111827" text-anchor="middle">Acelerômetro</text>
<text x="166" y="330" font-size="16" fill="#4b5563" text-anchor="middle">IIM-42351</text>

<!-- Botão -->
