  <g fill="#9ca3af">
    <rect x="-46" y="-26" width="12" height="6"/><rect x="-46" y="-10" width="12" height="6"/><rect x="-46" y="4" width="12" height="6"/><rect x="-46" y="20" width="12" height="6"/>
    <rect x="34" y="-26" width="12" height="6"/><rect x="34" y="-10" width="12" height="6"/><rect x="34" y="4" width="12" height="6"/><rect x="34" y="20" width="12" height="6"/>
    <rect x="-26" y="-46" width="6" height="12"/><rect x="-10" y="-46" width="6" height="12"/><rect x="4" y="-46" width="6" height="12"/><rect x="20" y="-46" width="6" height="12"/>
    <rect x="-26" y="34" width="6" height="12"/><rect x="-10" y="34" width="6" height="12"/><rect x="4" y="34" width="6" height="12"/><rect x="20" y="34" width="6" height="12"/>
  </g>
  <rect x="-36" y="-36" width="72" height="72" rx="8" fill="#1f2937"/>
  <circle cx="-26" cy="-26" r="3" fill="#6b7280"/>
  <g stroke-width="4" stroke-linecap="round">
