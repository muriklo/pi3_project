# SysCare - teste do advertising BLE (heartbeat)
# Placa: xiao_ble (XIAO nRF52840). Console pela USB.

# Bluetooth: só anúncio não-conectável
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y

# HMAC-SHA256 da assinatura, pela API PSA Crypto
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

CONFIG_MAIN_STACK_SIZE=4096
