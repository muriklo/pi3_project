# SysCare - acc_validation: validacao do acelerometro IIM-42351

# Console na USB (CDC ACM)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# Permite ao app esperar o terminal abrir (DTR) antes de imprimir
CONFIG_UART_LINE_CTRL=y

# Alimentacao do acelerometro (regulator-fixed no app.overlay).
# Os reguladores precisam iniciar ANTES do SPI (prioridade 50): o driver
# SPI coloca o CS em nivel alto no init e alimentaria o sensor desligado.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_INIT_PRIORITY=45

# Acelerometro
CONFIG_SPI=y
CONFIG_GPIO=y

# Logs no modo deferred (padrao). O printk passa pelo log, entao a ordem
# entre printk e LOG_* se mantem. Nao usar CONFIG_LOG_MODE_IMMEDIATE: com
# o console na USB a placa nao enumera (Windows: erro 43, falha no
# descritor). Testado em 25/10: imediato falha, deferred funciona.
CONFIG_LOG=y
# Folga para despejar o CSV da captura (padrao: 1 KB)
CONFIG_LOG_BUFFER_SIZE=4096

# Pilhas com folga para a formatacao dos printk (2 KB, como no app BLE)
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
