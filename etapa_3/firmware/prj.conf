CONFIG_BT=y
CONFIG_BT_BROADCASTER=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y

# Acelerometro IIM-42351 (modulo lib/, pinagem no app.overlay).
# Os reguladores precisam iniciar ANTES do SPI (prioridade 50): o driver
# SPI coloca o CS em nivel alto no init e alimentaria o sensor desligado.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_INIT_PRIORITY=45
CONFIG_SPI=y
CONFIG_GPIO=y

# Pilhas com folga: o main inicia o acelerometro e o driver trata as
# interrupcoes (SPI + callback) na workqueue do sistema
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
